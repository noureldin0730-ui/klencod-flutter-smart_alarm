name: smart_alarm
description: Smart alarm with camera face detection.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.11.0
  permission_handler: ^11.3.0
  flutter_background_service: ^5.0.5

flutter:
  uses-material-design: true